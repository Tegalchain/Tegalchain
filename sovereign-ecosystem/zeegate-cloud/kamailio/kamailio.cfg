#!KAMailio
#
# Zeegate lab SBC — registrar for DePIN edge nodes, routes media apps to FreeSWITCH.
# Domain: zeegate.lab | SIP: udp/tcp :5060

#!define MY_DOMAIN zeegate.lab
#!define FS_SETID 1

####### Global parameters #########

debug=2
log_stderror=yes
memdbg=5
memlog=5
log_facility=LOG_LOCAL0
fork=yes
children=4

/* Listen on all interfaces — docker publishes 5060 to the host for Zeegate/PJSIP */
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

####### Modules #########

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "db_text.so"
loadmodule "dispatcher.so"
loadmodule "nathelper.so"

####### Module parameters #########

modparam("db_text", "db_mode", 1)

modparam("auth_db", "db_url", "text:///etc/kamailio/dbtext")
modparam("auth_db", "calculate_ha1", yes)
modparam("auth_db", "password_column", "password")
modparam("auth_db", "load_credentials", "")

modparam("usrloc", "db_mode", 0)
modparam("usrloc", "nat_bflag", 5)

modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_contacts", 3)

modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "ds_ping_interval", 30)

modparam("nathelper", "natping_interval", 30)
modparam("nathelper", "ping_nated_only", 1)
modparam("nathelper", "sipping_bflag", 7)
modparam("nathelper", "sipping_from", "sip:pinger@zeegate.lab")

####### Routing logic #########

request_route {
    route(REQINIT);

    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }

    if (!is_method("INVITE|ACK|CANCEL|BYE|OPTIONS|INFO|UPDATE|REFER|NOTIFY")) {
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }

    record_route();

    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    if (is_method("INVITE")) {
        route(INVITE);
        exit;
    }

    sl_send_reply("404", "Not Found");
}

route[REQINIT] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Malformed SIP from $si:$sp\n");
        exit;
    }
}

route[REGISTRAR] {
    if (!www_authorize("", "subscriber")) {
        www_challenge("", "0");
        exit;
    }

    /* To user must match digest username (replaces uri_db check_to() for lab). */
    if ($tU != $au) {
        sl_send_reply("403", "Forbidden");
        exit;
    }

    if (!save("location")) {
        sl_reply_error();
        exit;
    }

    xlog("L_INFO", "REGISTER $fu from $si:$sp\n");
    exit;
}

route[INVITE] {
    if (!www_authorize("", "subscriber")) {
        www_challenge("", "0");
        exit;
    }

    /* Lab media extensions → FreeSWITCH */
    if ($rU =~ "^[1-9][0-9]{3}$") {
        route(TO_FREESWITCH);
        exit;
    }

    /* Edge node or subscriber → usrloc */
    if (lookup("location")) {
        route(RELAY);
        exit;
    }

    sl_send_reply("404", "Not Found");
}

route[TO_FREESWITCH] {
    if (!ds_select_dst("1", "4")) {
        sl_send_reply("503", "Media Server Unavailable");
        exit;
    }
    xlog("L_INFO", "INVITE $rU → FreeSWITCH ($du)\n");
    route(RELAY);
}

route[WITHINDLG] {
    if (has_body("application/sdp")) {
        if (nat_uac_test("19")) {
            fix_nated_contact();
        }
    }

    if (loose_route()) {
        route(RELAY);
        exit;
    }

    if (is_method("ACK")) {
        if (t_check_trans()) {
            route(RELAY);
            exit;
        }
        exit;
    }

    sl_send_reply("404", "Not Found");
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
