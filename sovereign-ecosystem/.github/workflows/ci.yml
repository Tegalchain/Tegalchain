name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEGALCHAIN_IDENTITY_MODE: dev
      TEGALCHAIN_REQUIRE_BEARER: "0"
      MINT_WORKER_BEARER_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        # tegalchain-core submodule is docs-only for CI; unit tests do not import it.
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tegalchain tests
        run: python -m unittest discover -s tegalchain -p 'test_*.py' -v

      - name: Run mint worker tests
        run: python -m unittest discover -s integrations/mint_worker -p 'test_*.py' -v

      - name: Run TP-102 proof of resonance tests
        run: python -m unittest discover -s proof_of_resonance_spec -p 'test_*.py' -v

      - name: Run TP-103 GreenLedger tests
        run: python -m unittest discover -s green_ledger_spec -p 'test_*.py' -v

      - name: Run TP-108 AI attestation tests
        run: python -m unittest discover -s ai_attestation_spec -p 'test_*.py' -v

      - name: Run TP-108 mint worker append tests
        run: python -m unittest integrations.mint_worker.test_tp108_append -v

      - name: Run Zeegate telemetry tests
        run: python -m unittest discover -s integrations/zeegate_telemetry -p 'test_*.py' -v

      - name: Run Zeegate CDR adapter tests
        run: PYTHONPATH=zeegate-cloud python -m unittest discover -s zeegate-cloud/cdr_adapter -p 'test_*.py' -v
