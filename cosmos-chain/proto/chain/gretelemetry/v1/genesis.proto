syntax = "proto3";
package chain.gretelemetry.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "chain/gretelemetry/v1/params.proto";

option go_package = "github.com/Tegalchain/Tegalchain/chain/x/gretelemetry/types";

// GenesisState defines the gretelemetry module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
