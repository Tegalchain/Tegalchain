services:
  kamailio:
    build:
      context: .
      dockerfile: Dockerfile.kamailio
    image: zeegate-kamailio:5.8.7-bookworm
    container_name: zeegate-kamailio
    restart: unless-stopped
    volumes:
      - ../kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ../kamailio/dispatcher.list:/etc/kamailio/dispatcher.list:ro
      - ../kamailio/dbtext:/etc/kamailio/dbtext:ro
    ports:
      - "${KAMAILIO_SIP_UDP:-5060}:5060/udp"
      - "${KAMAILIO_SIP_TCP:-5060}:5060/tcp"
    networks:
      - zeegate-voice
    depends_on:
      freeswitch:
        condition: service_started

  freeswitch:
    image: safarov/freeswitch:latest
    container_name: zeegate-freeswitch
    restart: unless-stopped
    environment:
      # Reduce NAT/STUN noise; IPv6 profile bind failures are non-fatal for lab IPv4.
      FREESWITCH_FLAGS: "-nonat"
    volumes:
      - ../freeswitch/dialplan/public/00_zeegate_lab.xml:/etc/freeswitch/dialplan/public/00_zeegate_lab.xml:ro
      - ../freeswitch/sip_profiles/external.xml:/etc/freeswitch/sip_profiles/external.xml:ro
      - ../freeswitch/autoload_configs/cdr_csv.conf.xml:/etc/freeswitch/autoload_configs/cdr_csv.conf.xml:ro
      - ../freeswitch/autoload_configs/event_socket.conf.xml:/etc/freeswitch/autoload_configs/event_socket.conf.xml:ro
      - zeegate_cdr:/var/log/freeswitch/cdr-csv
    ports:
      - "${FREESWITCH_SIP_UDP:-5080}:5080/udp"
      - "${FREESWITCH_SIP_TCP:-5080}:5080/tcp"
      - "${RTP_START:-16384}-${RTP_END:-16394}:${RTP_START:-16384}-${RTP_END:-16394}/udp"
    networks:
      - zeegate-voice

networks:
  zeegate-voice:
    name: zeegate-voice

volumes:
  zeegate_cdr:
    name: zeegate_cdr
